<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#007bff">
    <title>BME Find</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
    <button class="floating-btn search-btn" id="searchArrow"><img src="magnifier.svg" alt="Keresés" class="btn-icon"></button>
    <button class="floating-btn map-btn" id="mapArrow"><img src="map.svg" alt="Vissza a térképre" class="btn-icon"></button>
    <button class="floating-btn next-btn" id="nextArrow"><img src="arrow.svg" alt="Következő" class="btn-icon"></button>
    <button class="floating-btn door-btn" id="doorArrow"><img src="door.svg" alt="Másik bejárat" class="btn-icon"></button>
    <div id="sidebar">
        <button id="searchButton" class="primary">Terem keresése</button>
        <button id="nextButton" class="disabled" disabled>Következő</button>
        <button id="doorButton" class="secondary" style="display: none;">Másik bejárat</button>
        <button id="returnButton" class="secondary">Visszatérés a térképre</button>
    </div>
    <canvas id="canvas"></canvas>

    <!-- Door Selection Modal -->
    <div id="doorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Bejárat választó</h3>
                <span class="close" data-modal="doorModal">&times;</span>
            </div>
            <ul id="doorList" class="door-list"></ul>
        </div>
    </div>

    <script src="priority_queue.js"></script>
    <script src="api-client.js"></script>
    <script src="app.js"></script>
</body>
</html>
