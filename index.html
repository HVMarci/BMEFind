<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#007bff">
    <title>BME Find</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(211, 211, 211, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 95; /* above canvas, below sidebar */
            pointer-events: none;
        }

        .loading-overlay:not(.active) {
            opacity: 0;
            visibility: hidden;
            transition: opacity 120ms ease, visibility 0s linear 120ms;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 120ms ease;
        }

        .loading-spinner {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.55);
            border-top-color: rgba(255, 255, 255, 0.95);
            animation: bmefind-spin 0.9s linear infinite;
        }

        @keyframes bmefind-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
    <button class="floating-btn search-btn" id="searchArrow"><img src="magnifier.svg" alt="Keresés" class="btn-icon"></button>
    <button class="floating-btn map-btn" id="mapArrow"><img src="map.svg" alt="Vissza a térképhez" class="btn-icon"></button>
    <button class="floating-btn prev-btn" id="prevArrow"><img src="arrow.svg" alt="Előző" class="btn-icon flip-x"></button>
    <button class="floating-btn next-btn" id="nextArrow"><img src="arrow.svg" alt="Következő" class="btn-icon"></button>
    <button class="floating-btn door-btn" id="doorArrow"><img src="door.svg" alt="Másik bejárat" class="btn-icon"></button>
    <div id="sidebar">
        <button id="searchButton" class="primary">Terem keresése</button>
        <button id="prevButton" class="disabled" disabled>Előző</button>
        <button id="nextButton" class="disabled" disabled>Következő</button>
        <button id="doorButton" class="disabled" disabled>Másik bejárat</button>
        <button id="buildingSelector" class="primary btn-success">Épület választó</button>
        <button id="floorSelector" class="disabled" disabled>Szint választó</button>
        <button id="returnButton" class="disabled" disabled>Visszatérés a térképhez</button>
        <button id="feedbackButton" class="secondary">Visszajelz&#233;s</button>
    </div>
    <canvas id="canvas"></canvas>
    <div id="loadingOverlay" class="loading-overlay active" aria-hidden="true">
        <div class="loading-spinner" aria-hidden="true"></div>
    </div>
    <div id="floorQuickButtons" class="floor-quick-buttons" aria-label="Szint gyorsválasztó"></div>

    <!-- Building Selector Modal -->
    <div id="buildingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Épület választó</h3>
                <span class="close" data-modal="buildingModal">&times;</span>
            </div>
            <input id="buildingSearch" class="modal-search" type="text" placeholder="Keresés épületre..." autocomplete="off">
            <ul id="buildingList" class="building-list"></ul>
        </div>
    </div>

    <!-- Floor Selector Modal -->
    <div id="floorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Szint választó</h3>
                <span class="close" data-modal="floorModal">&times;</span>
            </div>
            <input id="floorSearch" class="modal-search" type="text" placeholder="Keresés szintre..." autocomplete="off">
            <ul id="floorList" class="building-list"></ul>
        </div>
    </div>

    <!-- Door Selection Modal -->
    <div id="doorModal" class="modal">
        <div class="modal-content room-search-content">
            <div class="modal-header">
                <h3>Bejárat választó</h3>
                <span class="close" data-modal="doorModal">&times;</span>
            </div>
            <ul id="doorList" class="door-list"></ul>
        </div>
    </div>

    <!-- Room Search Modal -->
    <div id="roomSearchModal" class="modal">
        <div class="modal-content room-search-content">
            <div class="modal-header">
                <h3>Terem keresése</h3>
                <span class="close" data-modal="roomSearchModal">&times;</span>
            </div>
            <input id="roomSearchInput" class="modal-search" type="text" placeholder="Keresés teremre..." autocomplete="off">
            <div id="roomSearchHint" class="modal-hint">Kezdj el gépelni (min. 1 karakter)...</div>
            <div id="roomSearchList" class="virtual-list" role="listbox" aria-label="Találatok"></div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Visszajelz&#233;s k&#252;ld&#233;se</h3>
                <span class="close" data-modal="feedbackModal">&times;</span>
            </div>
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="feedbackEmail">E-mail c&#237;m:</label>
                    <input type="email" id="feedbackEmail" required autocomplete="email" inputmode="email">
                </div>
                <div class="form-group">
                    <label for="feedbackText">Visszajelz&#233;s:</label>
                    <textarea id="feedbackText" required rows="6"></textarea>
                </div>
                <div id="feedbackError" class="error-message" style="display: none;"></div>
                <div id="feedbackSuccess" class="success-message" style="display: none;"></div>
                <button type="submit" id="feedbackSubmit" class="btn-primary">K&#252;ld&#233;s</button>
            </form>
        </div>
    </div>

    <script src="priority_queue.js"></script>
    <script src="globals.js"></script>
    <script src="api-client.js"></script>
    <script src="app.js"></script>
</body>
</html>
