<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BME Find - Development UI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dev.css">
</head>
<body>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
    <button class="next-arrow" id="nextArrow">&#8594;</button>
    <div id="sidebar">
        <h2>Development Mode</h2>
        <button id="searchButton" class="primary">Terem keresése</button>
        <button id="nextButton" class="disabled" disabled>Következő</button>
        <button id="returnButton" class="secondary">Visszatérés a térképre</button>
        <button id="buildingSelector" class="primary btn-success">Térkép választó</button>
        <button id="saveToDatabase" class="primary btn-danger">Módosítások mentése</button>
        <button id="exportNodes" class="primary btn-info">Export csucsok.csv</button>
        <button id="exportEdges" class="primary btn-warning">Export elek.txt</button>

        <div class="node-type-selector">
            <label>Csúcs típus:</label>
            <select id="nodeTypeSelector">
                <option value="0">0 - Folyosó</option>
                <option value="1">1 - Terem</option>
                <option value="2">2 - Ajtó</option>
            </select>
        </div>

        <div class="dev-info">
            <strong>Dev Features:</strong>
            • ALT+Click: Get image coordinates<br>
            • CTRL+Click: Add new node<br>
            • SHIFT+Click: Select node<br>
            • SHIFT+Click again: Toggle connection<br>
            • CTRL+Click on selected node: Delete node<br>
            • Check browser console for logs
        </div>
    </div>
    <canvas id="canvas"></canvas>
    
    <!-- Building Selector Modal -->
    <div id="buildingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Térkép választó</h3>
                <span class="close" data-modal="buildingModal">&times;</span>
            </div>
            <ul id="buildingList" class="building-list">
                <!-- Buildings will be populated here -->
            </ul>
        </div>
    </div>
    
    <!-- Export CSV Modal -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Csucsok CSV Export</h3>
                <span class="close" data-modal="exportModal">&times;</span>
            </div>
            <textarea id="exportTextarea" readonly></textarea>
            <button id="copyButton">📋 Másolás vágólapra</button>
        </div>
    </div>
    
    <script src="priority_queue.js"></script>
    <script src="api-client.js"></script>
    <script src="app.js"></script>
    <script src="dev.js"></script>
</body>
</html>
